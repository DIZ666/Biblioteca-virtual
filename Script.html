<script>
/**
 * Biblioteca Virtual GOSCh - Lógica del Cliente
 */

// Variables de Estado Global
let currentUser = null;
let allBooks = [];

// Storage Helper a prueba de fallos para navegadores móviles y webviews privados
const SafeStorage = {
  getItem: function(key) {
    try {
      return localStorage.getItem(key);
    } catch (e) {
      console.warn("SafeStorage: localStorage.getItem falló, usando memoria.");
      return window["_mem_" + key] || null;
    }
  },
  setItem: function(key, value) {
    try {
      localStorage.setItem(key, value);
    } catch (e) {
      console.warn("SafeStorage: localStorage.setItem falló, usando memoria.");
      window["_mem_" + key] = value;
    }
  },
  removeItem: function(key) {
    try {
      localStorage.removeItem(key);
    } catch (e) {
      console.warn("SafeStorage: localStorage.removeItem falló, usando memoria.");
      delete window["_mem_" + key];
    }
  }
};

// Ejecución al iniciar la página
document.addEventListener("DOMContentLoaded", function() {
  // Registrar Service Worker para PWA
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js')
        .then(reg => console.log('Service Worker registrado con éxito:', reg.scope))
        .catch(err => console.error('Error al registrar Service Worker:', err));
    });
  }
  
  checkSession();
  
  // Control automático para la categoría "Otros" (debe asignarse directamente a Obra / Bibliografía General)
  const upCategoria = document.getElementById("up-categoria");
  if (upCategoria) {
    upCategoria.addEventListener("change", function() {
      const upTipoDoc = document.getElementById("up-tipo-doc");
      if (upTipoDoc) {
        if (this.value === "Otros") {
          upTipoDoc.value = "Libro"; // Obra / Bibliografía General
          upTipoDoc.disabled = true;
        } else {
          upTipoDoc.disabled = false;
        }
      }
    });
  }
  
  // Drag and drop events for upload
  const dropzone = document.getElementById("file-dropzone");
  if (dropzone) {
    ['dragenter', 'dragover'].forEach(eventName => {
      dropzone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropzone.classList.add('highlight');
      }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropzone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropzone.classList.remove('highlight');
      }, false);
    });

    dropzone.addEventListener('drop', (e) => {
      const dt = e.dataTransfer;
      const files = dt.files;
      const fileInput = document.getElementById("up-file");
      if (files.length > 0) {
        fileInput.files = files;
        updateFileLabel(fileInput);
      }
    }, false);
  }
});

/**
 * Verifica si hay una sesión guardada localmente
 */
function checkSession() {
  const sessionUser = SafeStorage.getItem("gosch_user");
  if (sessionUser) {
    try {
      currentUser = JSON.parse(sessionUser);
      // Validar sesión con el servidor (seguridad)
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function(isValid) {
            if (isValid) {
              mostrarApp();
            } else {
              logoutUser();
            }
          })
          .withFailureHandler(function() {
            logoutUser();
          })
          .validarSesion(currentUser.email);
      } else {
        // Modo Desarrollo Local
        mostrarApp();
      }
    } catch(e) {
      logoutUser();
    }
  } else {
    mostrarPortico();
  }
}

/**
 * Cambia la vista entre Login y Registro
 */
function switchAuthTab(tab) {
  const btnLogin = document.getElementById("tab-login");
  const btnReg = document.getElementById("tab-register");
  const formLogin = document.getElementById("form-login");
  const formReg = document.getElementById("form-register");
  const status = document.getElementById("auth-status");
  
  status.className = "status-box";
  status.textContent = "";
  
  if (tab === 'login') {
    btnLogin.classList.add("active");
    btnReg.classList.remove("active");
    formLogin.classList.add("active");
    formReg.classList.remove("active");
  } else {
    btnLogin.classList.remove("active");
    btnReg.classList.add("active");
    formLogin.classList.remove("active");
    formReg.classList.add("active");
  }
}

/**
 * Cambia la pestaña de la aplicación principal
 */
function switchTab(tabId) {
  // Desactivar todos los botones y paneles
  document.querySelectorAll(".nav-tab").forEach(btn => btn.classList.remove("active"));
  document.querySelectorAll(".tab-panel").forEach(panel => panel.classList.remove("active"));
  
  // Activar correspondiente
  const tabBtn = document.getElementById("nav-" + tabId);
  const panel = document.getElementById("tab-content-" + tabId);
  
  if (tabBtn && panel) {
    tabBtn.classList.add("active");
    panel.classList.add("active");
  }
  
  // Acciones específicas de pestaña
  if (tabId === 'catalog' || tabId === 'instruction' || tabId === 'drawings') {
    cargarLibros();
  } else if (tabId === 'stats') {
    inicializarGraficos();
    actualizarDashboardMetricas();
    setTimeout(function() {
      if (window.tfAgent && typeof window.tfAgent.dibujarRedNeuronal === 'function') {
        window.tfAgent.dibujarRedNeuronal();
      }
    }, 150);
  } else if (tabId === 'proposals') {
    cargarTemasSugeridos();
  } else if (tabId === 'loans') {
    cargarPrestamos();
  } else if (tabId === 'admin') {
    cargarMiembrosAdmin();
    cargarDocumentosAdmin();
  }
}

/**
 * Procesa el Inicio de Sesión
 */
function handleLogin() {
  const email = document.getElementById("login-email").value;
  const pin = document.getElementById("login-pin").value;
  const status = document.getElementById("auth-status");
  
  status.className = "status-box";
  status.textContent = "Tocando la puerta del templo...";
  status.style.display = "block";
  
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(function(response) {
        if (response.success) {
          currentUser = response.user;
          SafeStorage.setItem("gosch_user", JSON.stringify(currentUser));
          status.className = "status-box success";
          status.textContent = "Los trabajos están abiertos. Entrando...";
          
          setTimeout(function() {
            mostrarApp();
          }, 1000);
        } else {
          status.className = "status-box error";
          status.textContent = response.message;
        }
      })
      .withFailureHandler(function(err) {
        status.className = "status-box error";
        status.textContent = "Error de conexión: " + err.message;
      })
      .loginUsuario(email, pin);
  } else {
    // Simulación local para pruebas
    if (email && pin) {
      currentUser = {
        nombre: "Juan",
        apellido: "Pérez",
        email: email,
        grado: "3",
        estado: "Activo"
      };
      SafeStorage.setItem("gosch_user", JSON.stringify(currentUser));
      status.className = "status-box success";
      status.textContent = "[MODO LOCAL] Entrada concedida.";
      setTimeout(mostrarApp, 1000);
    }
  }
}

/**
 * Procesa la solicitud de Registro
 */
function handleRegister() {
  const nombre = document.getElementById("reg-name").value;
  const apellido = document.getElementById("reg-lastname").value;
  const email = document.getElementById("reg-email").value;
  const grado = document.getElementById("reg-grado").value;
  const pin = document.getElementById("reg-pin").value;
  const passcode = document.getElementById("reg-passcode").value;
  const status = document.getElementById("auth-status");
  
  status.className = "status-box";
  status.textContent = "Grabando su nombre en las columnas...";
  status.style.display = "block";
  
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(function(response) {
        if (response.success) {
          if (response.estado === "Activo") {
            currentUser = response.user;
            SafeStorage.setItem("gosch_user", JSON.stringify(currentUser));
            status.className = "status-box success";
            status.textContent = response.message;
            setTimeout(mostrarApp, 2500);
          } else {
            status.className = "status-box success";
            status.textContent = response.message;
            // Limpiar formulario y enviar a login
            setTimeout(function() {
              switchAuthTab('login');
              document.getElementById("login-email").value = email;
            }, 5000);
          }
        } else {
          status.className = "status-box error";
          status.textContent = response.message;
        }
      })
      .withFailureHandler(function(err) {
        status.className = "status-box error";
        status.textContent = "Error al conectar con la base de datos: " + err.message;
      })
      .registrarUsuario(nombre, apellido, email, parseInt(grado), pin, passcode);
  } else {
    // Simulación Local
    status.className = "status-box success";
    status.textContent = "[MODO LOCAL] Registro recibido. Si usó la palabra 'tubalcain' para grado 1, se auto-aprobó.";
    setTimeout(function() {
      switchAuthTab('login');
    }, 2000);
  }
}

/**
 * Muestra el Pórtico y oculta la App
 */
function mostrarPortico() {
  document.getElementById("app-container").classList.remove("active");
  document.getElementById("portico-container").classList.add("active");
  document.body.style.alignItems = "center";
}

/**
 * Muestra la App y oculta el Pórtico
 */
function mostrarApp() {
  document.getElementById("portico-container").classList.remove("active");
  document.getElementById("app-container").classList.add("active");
  document.body.style.alignItems = "flex-start";
  
  // Si es Patricio Díaz, asegurar Grado 2 (Compañero) y Rol Administrador
  if (currentUser && currentUser.email) {
    const e = currentUser.email.toLowerCase();
    if (e.indexOf("patricio.diaz") !== -1 || e.indexOf("diaz.patricio") !== -1 || e.indexOf("diazp") !== -1) {
      currentUser.grado = 2;
      currentUser.rol = "Administrador";
      SafeStorage.setItem("gosch_user", JSON.stringify(currentUser));
    }
  }

  // Rellenar información de usuario
  let gradoTxt = "H:.";
  if (currentUser.grado == 1) gradoTxt = "Ap:. M:. (1°)";
  else if (currentUser.grado == 2) gradoTxt = "Comp:. M:. (2°)";
  else if (currentUser.grado == 3) gradoTxt = "M:. M:. (3°)";
  else if (currentUser.grado >= 4 && currentUser.grado < 33) gradoTxt = `Grado ${currentUser.grado}°`;
  else if (currentUser.grado == 33) gradoTxt = "S:. G:. I:. G:. (33°)";
  else gradoTxt = `S:. P:. G:. ${currentUser.grado}°`;

  document.getElementById("user-display-name").textContent = `Q:. H:. ${currentUser.nombre} ${currentUser.apellido}`;
  document.getElementById("user-display-grade").textContent = gradoTxt;
    
  // Mostrar/Ocultar Tab de Administración dinámicamente según rol
  const adminTabBtn = document.getElementById("nav-admin");
  if (adminTabBtn) {
    if (esUsuarioAdministrador()) {
      adminTabBtn.style.display = "flex";
    } else {
      adminTabBtn.style.display = "none";
    }
  }
  
  // Cargar categorías del servidor e iniciar componentes
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(function(cats) {
        window.categoriasOrden = cats;
        cargarCategoriasEnSelector();
        cargarLibros();
        
        // Iniciar agente TensorFlow localmente
        setTimeout(function() {
          if (window.tfAgent) {
            window.tfAgent.iniciar(currentUser);
          }
        }, 1000);
      })
      .withFailureHandler(function() {
        window.categoriasOrden = null;
        cargarCategoriasEnSelector();
        cargarLibros();
      })
      .obtenerCategorias();
  } else {
    window.categoriasOrden = null;
    cargarCategoriasEnSelector();
    cargarLibros();
    setTimeout(function() {
      if (window.tfAgent) {
        window.tfAgent.iniciar(currentUser);
      }
    }, 1000);
  }
}

/**
 * Cierra la sesión
 */
function logoutUser() {
  currentUser = null;
  SafeStorage.removeItem("gosch_user");
  mostrarPortico();
}

/**
 * Carga los préstamos desde el servidor o simulación
 */
function cargarPrestamos() {
  const tbody = document.getElementById("loans-table-body");
  if (tbody) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:15px; color:var(--text-secondary);">Cargando préstamos de la Logia...</td></tr>';
  }
  
  // Configurar visibilidad del panel administrativo de registro
  const esAdmin = esUsuarioAdministrador();
  const regPanel = document.getElementById("loan-register-panel");
  if (regPanel) {
    regPanel.style.display = esAdmin ? "flex" : "none";
  }
  
  // Mostrar/Ocultar celdas de acciones según permisos
  document.querySelectorAll(".admin-only-cell").forEach(cell => {
    cell.style.display = esAdmin ? "" : "none";
  });
  
  if (esAdmin) {
    poblarSelectHermanos();
  }
  
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(function(response) {
        if (response && response.success) {
          renderPrestamos(response.prestamos || []);
        } else {
          const errMsg = (response && response.message) ? response.message : "Error desconocido al cargar préstamos.";
          if (tbody) {
            tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding:15px; color:#ff4d4d;">${errMsg}</td></tr>`;
          }
        }
      })
      .withFailureHandler(function(err) {
        if (tbody) {
          tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding:15px; color:#ff4d4d;">Fallo del servidor: ${err.message}</td></tr>`;
        }
      })
      .obtenerPrestamos();
  } else {
    // Simulación local fallback
    setTimeout(() => {
      renderPrestamos(window._mock_prestamos || []);
    }, 400);
  }
}

/**
 * Renders the loans table list
 */
function renderPrestamos(prestamos) {
  const tbody = document.getElementById("loans-table-body");
  if (!tbody) return;
  
  if (prestamos.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:15px; color:var(--text-secondary);">No hay registros de préstamos de libros físicos en la Logia.</td></tr>';
    return;
  }
  
  const esAdmin = esUsuarioAdministrador();
  tbody.innerHTML = "";
  
  prestamos.forEach(p => {
    const tr = document.createElement("tr");
    tr.style.borderBottom = "1px solid rgba(255, 255, 255, 0.05)";
    tr.style.color = "var(--text-primary)";
    
    // Parsear fecha y comprobar si está vencido (> plazo en días)
    let vencido = false;
    if (p.estado === "Activo" && p.fechaPrestamo) {
      const parts = p.fechaPrestamo.split("-");
      if (parts.length === 3) {
        const fPrest = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
        const diffTime = Date.now() - fPrest.getTime();
        const diffDays = diffTime / (1000 * 60 * 60 * 24);
        if (diffDays > p.diasPrestamo) {
          vencido = true;
        }
      }
    }
    
    const badgeColor = p.estado === "Activo" ? (vencido ? "#ff4d4d" : "#ffd43f") : "#4caf50";
    const badgeBg = p.estado === "Activo" ? (vencido ? "rgba(255, 77, 77, 0.15)" : "rgba(255, 212, 63, 0.15)") : "rgba(76, 175, 80, 0.15)";
    const badgeText = p.estado === "Activo" ? (vencido ? "Vencido" : "Activo") : "Devuelto";
    
    let actionsHtml = "";
    if (esAdmin) {
      if (p.estado === "Activo") {
        actionsHtml = `<button onclick="ejecutarDevolucion('${p.id}')" class="masonic-btn-sm btn-gold" style="padding: 4px 8px; font-size: 10px; height: auto;">Devolver</button>`;
      } else {
        actionsHtml = `<span style="color:var(--text-secondary); font-size:10px;">Completado</span>`;
      }
    }
    
    tr.innerHTML = `
      <td style="padding: 10px 8px; font-weight: 500;">${escapeHtml(p.libroFisico)}</td>
      <td style="padding: 10px 8px;">${escapeHtml(p.hermanoNombre)}<br><span style="font-size:9px; color:var(--text-secondary);">${escapeHtml(p.hermanoEmail)}</span></td>
      <td style="padding: 10px 8px;">${p.fechaPrestamo || "-"}</td>
      <td style="padding: 10px 8px; text-align: center;">${p.diasPrestamo}</td>
      <td style="padding: 10px 8px;">${p.fechaDevolucion || "-"}</td>
      <td style="padding: 10px 8px;">
        <span style="display:inline-block; padding: 2px 6px; border-radius: 4px; font-size: 9px; font-weight: 600; color: ${badgeColor}; background: ${badgeBg}; border: 1px solid ${badgeColor}33;">
          ${badgeText}
        </span>
      </td>
      <td style="padding: 10px 8px; text-align: right;" class="admin-only-cell">${actionsHtml}</td>
    `;
    
    const actionsCell = tr.querySelector(".admin-only-cell");
    if (actionsCell) {
      actionsCell.style.display = esAdmin ? "" : "none";
    }
    
    tbody.appendChild(tr);
  });
}

/**
 * Puebla el selector de Hermanos
 */
function poblarSelectHermanos() {
  const select = document.getElementById("loan-brother-select");
  if (!select) return;
  
  if (select.options.length > 1) return; // Ya poblado
  
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(function(response) {
        if (response && response.success && response.miembros) {
          select.innerHTML = '<option value="">Seleccione un hermano...</option>';
          response.miembros.filter(m => m.estado === "Activo").forEach(m => {
            const opt = document.createElement("option");
            opt.value = m.email;
            opt.dataset.nombre = `${m.nombre} ${m.apellido}`;
            opt.textContent = `${m.nombre} ${m.apellido} (${m.email})`;
            select.appendChild(opt);
          });
        }
      })
      .obtenerMiembros(currentUser.email);
  }
}

/**
 * Registra un nuevo préstamo
 */
function registrarNuevoPrestamo() {
  const libro = document.getElementById("loan-book-title").value.trim();
  const select = document.getElementById("loan-brother-select");
  const emailHermano = select.value;
  const optSelected = select.options[select.selectedIndex];
  const nombreHermano = optSelected ? optSelected.dataset.nombre : "";
  const dias = document.getElementById("loan-duration-days").value;
  
  if (!libro || !emailHermano || !dias) {
    alert("Por favor rellene todos los campos (Libro, Hermano y Días de plazo).");
    return;
  }
  
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(function(response) {
        if (response && response.success) {
          alert(response.message);
          document.getElementById("loan-book-title").value = "";
          select.value = "";
          cargarPrestamos();
        } else {
          alert("Error: " + (response ? response.message : "Falla en registro"));
        }
      })
      .withFailureHandler(function(err) {
        alert("Falla del servidor: " + err.message);
      })
      .registrarPrestamo(currentUser.email, libro, emailHermano, nombreHermano, dias);
  } else {
    // Simulación local fallback
    if (!window._mock_prestamos) window._mock_prestamos = [];
    window._mock_prestamos.push({
      id: "PREST" + Date.now(),
      libroFisico: libro,
      hermanoEmail: emailHermano,
      hermanoNombre: nombreHermano,
      fechaPrestamo: new Date().toISOString().substring(0, 10),
      diasPrestamo: parseInt(dias) || 14,
      fechaDevolucion: "",
      estado: "Activo"
    });
    alert("Préstamo registrado con éxito (Simulación local).");
    document.getElementById("loan-book-title").value = "";
    select.value = "";
    cargarPrestamos();
  }
}

/**
 * Procesa la devolución de un préstamo
 */
function ejecutarDevolucion(prestamoId) {
  if (!confirm("¿Confirma la devolución del libro físico seleccionado?")) return;
  
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(function(response) {
        if (response && response.success) {
          alert(response.message);
          cargarPrestamos();
        } else {
          alert("Error: " + (response ? response.message : "Falla al devolver"));
        }
      })
      .withFailureHandler(function(err) {
        alert("Falla del servidor: " + err.message);
      })
      .devolverPrestamo(currentUser.email, prestamoId);
  } else {
    // Simulación local fallback
    if (window._mock_prestamos) {
      const p = window._mock_prestamos.find(x => x.id === prestamoId);
      if (p) {
        p.estado = "Devuelto";
        p.fechaDevolucion = new Date().toISOString().substring(0, 10);
        alert("Devolución simulada con éxito.");
        cargarPrestamos();
      }
    }
  }
}

/**
 * Carga los libros de la base de datos
 */
function cargarLibros() {
  const grid = document.getElementById("books-grid");
  const instGrid = document.getElementById("instruction-grid");
  const drawingsGrid = document.getElementById("drawings-grid");
  
  if (grid) grid.innerHTML = '<div class="loading-spinner">Cargando biblioteca de la Orden...</div>';
  if (instGrid) instGrid.innerHTML = '<div class="loading-spinner">Cargando materiales de instrucción...</div>';
  if (drawingsGrid) drawingsGrid.innerHTML = '<div class="loading-spinner">Cargando trazados de la Orden...</div>';
  
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(function(response) {
        try {
          if (response && response.success) {
            allBooks = response.libros || [];
            distribuirYRenderizar(allBooks);
          } else {
            const errMsg = (response && response.message) ? response.message : "Error: El servidor retornó una respuesta nula o inválida.";
            if (grid) grid.innerHTML = `<div class="status-box error">${errMsg}</div>`;
            if (instGrid) instGrid.innerHTML = `<div class="status-box error">${errMsg}</div>`;
            if (drawingsGrid) drawingsGrid.innerHTML = `<div class="status-box error">${errMsg}</div>`;
          }
        } catch(e) {
          alert("Error en éxito del cliente: " + e.message + "\nStack: " + e.stack);
        }
      })
      .withFailureHandler(function(err) {
        alert("Falla en la llamada al servidor: " + err.message + "\nStack: " + err.stack);
        if (grid) grid.innerHTML = `<div class="status-box error">Error al cargar libros: ${err.message}</div>`;
        if (instGrid) instGrid.innerHTML = `<div class="status-box error">Error al cargar materiales: ${err.message}</div>`;
        if (drawingsGrid) drawingsGrid.innerHTML = `<div class="status-box error">Error al cargar trazados: ${err.message}</div>`;
      })
      .obtenerLibros(currentUser.email);
  } else {
    // Libros simulados locales
    allBooks = [];
    setTimeout(() => distribuirYRenderizar(allBooks), 500);
  }
}

/**
 * Ejecuta la sincronización manual con Google Drive
 */
function sincronizarDrive() {
  const btn = document.getElementById("btn-sync-drive");
  if (!btn) return;
  
  const originalHtml = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = `
    <svg class="spin-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 5px; animation: spin 1s linear infinite;">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
    </svg>
    Sincronizando...
  `;
  
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(function(response) {
        btn.disabled = false;
        btn.innerHTML = originalHtml;
        if (response && response.success) {
          alert(response.message);
          cargarLibros(); // Recargar todos los grids
        } else {
          alert("Error: " + (response ? response.message : "Respuesta nula."));
        }
      })
      .withFailureHandler(function(err) {
        btn.disabled = false;
        btn.innerHTML = originalHtml;
        alert("Falla en la red al sincronizar: " + err.message);
      })
      .ejecutarSincronizacionDrive(currentUser.email);
  } else {
    // Simulación local
    setTimeout(() => {
      btn.disabled = false;
      btn.innerHTML = originalHtml;
      alert("Simulación Local: Sincronización de Drive completada con éxito.");
    }, 1500);
  }
}

function escapeHtml(str) {
  if (!str) return "";
  return str.toString()
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

let currentViewMode = window.innerWidth <= 768 ? 'list' : 'grid';

function initLayoutToggleButtons() {
  const buttons = document.querySelectorAll('.layout-toggle-btn');
  buttons.forEach(btn => {

    const iconSvg = btn.querySelector('svg');
    if (currentViewMode === 'list') {
      if (textSpan) textSpan.textContent = 'Cuadrícula';
      if (iconSvg) {

          <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>

    } else {

function distribuirYRenderizar(libros) {
  try {
    if (!libros) {
      alert("Error: libros es nulo o indefinido en distribuirYRenderizar");
      return;
    }
    // 1. Libros para la Cámara de Lectura (Tipo "Libro" o vacío)
    const lecturaLibros = libros.filter(l => {
      const t = (l.tipo_documento || "").toString().trim().toLowerCase();
      return t === "libro" || t === "";
    });
    
    // 2. Materiales para la Cámara de Instrucción (Tipo "Material")
    const instruccionLibros = libros.filter(l => {
      const t = (l.tipo_documento || "").toString().trim().toLowerCase();
      return t === "material";
    });
    
    // 3. Trazados de la Orden (Tipo "Trazado")
    const drawingsLibros = libros.filter(l => {
      const t = (l.tipo_documento || "").toString().trim().toLowerCase();
      return t === "trazado";
    });
    
    // Ordenar dinámicamente según afinidad de la IA (Recomendado Primero, Expansión Segundo)
    const ordenarPorIA = (arr) => {
      if (window.iaRecomendada || window.iaExpansion) {
        return [...arr].sort((a, b) => {
          const aWeight = (a.categoria === window.iaRecomendada) ? 2 : (a.categoria === window.iaExpansion ? 1 : 0);
          const bWeight = (b.categoria === window.iaRecomendada) ? 2 : (b.categoria === window.iaExpansion ? 1 : 0);
          return bWeight - aWeight; // Pone peso mayor primero
        });
      }
      return arr;
    };
    
    initLayoutToggleButtons();
    
    renderGrid("books-grid", ordenarPorIA(lecturaLibros));
    renderGrid("instruction-grid", ordenarPorIA(instruccionLibros));
    renderGrid("drawings-grid", ordenarPorIA(drawingsLibros));
  } catch(e) {
    alert("Error en distribuirYRenderizar: " + e.message + "\nStack: " + e.stack);
  }
}

function filtrarLibros() {
  const query = document.getElementById("search-input").value.toLowerCase();
  const lecturaLibros = allBooks.filter(l => l.tipo_documento === "Libro" || !l.tipo_documento);
  const filtrados = lecturaLibros.filter(libro => 
    (libro.titulo || "").toLowerCase().includes(query) || 
    (libro.autor || "").toLowerCase().includes(query) || 
    (libro.categoria || "").toLowerCase().includes(query)
  );
  renderGrid("books-grid", filtrados);
}

/**
 * Abre el lector de PDF en el modal
 */
function leerLibro(libroId, titulo, url) {
  if (!url) {
    alert("Este libro no tiene visor habilitado.");
    return;
  }
  
  // Registrar actividad
  registrarActividadUsuario(libroId, titulo, "Leer");
  
  document.getElementById("reader-title").textContent = titulo;
  const frame = document.getElementById("reader-frame");
  frame.src = url;
  
  document.getElementById("reader-modal").classList.add("active");
}

/**
 * Cierra el modal de lectura
 */
function closeReader() {
  document.getElementById("reader-modal").classList.remove("active");
  document.getElementById("reader-frame").src = "";
}

/**
 * Descarga el archivo de Google Drive
 */
function descargarLibro(libroId, titulo, url, categoria) {
  if (!url) {
    alert("Este archivo no está disponible para descarga directa.");
    return;
  }
  
  // Registrar actividad
  registrarActividadUsuario(libroId, titulo, "Descargar", categoria);
  
  // Descarga en pestaña externa
  window.open(url, '_blank');
}

/**
 * Registra actividad del usuario en Sheets
 */
function registrarActividadUsuario(libroId, titulo, accion, categoria = "General") {
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run.registrarActividad(currentUser.email, currentUser.grado, accion, libroId, titulo, categoria);
  }
  
  // Alimentar agente TensorFlow de forma local
  if (window.tfAgent) {
    window.tfAgent.registrarLocal(accion, categoria);
  }
}

    label.style.color = "var(--text-primary)";

/**
 * Analiza el nombre del archivo y lee los metadatos internos del PDF
 */
function extraerMetadatosArchivo(file) {
  const filename = file.name;
  const cleanName = filename.substring(0, filename.lastIndexOf('.')) || filename;
  
  let titulo = cleanName;
  let autor = "";
  
  // 1. Intentar extraer del nombre usando patrones habituales
  const parenRegex = /([^(]+)\(([^)]+)\)/;
  const parenMatch = cleanName.match(parenRegex);
  
  const hyphenRegex = /([^-]+)-([^-]+)/;
  const hyphenMatch = cleanName.match(hyphenRegex);
  
  if (parenMatch) {
    titulo = parenMatch[1].trim();
    autor = parenMatch[2].trim();
  } else if (hyphenMatch) {
    titulo = hyphenMatch[1].trim();
    autor = hyphenMatch[2].trim();
  } else {
    // Reemplazar guiones bajos o medios generales por espacios
    titulo = cleanName.replace(/_/g, ' ').replace(/-/g, ' ').trim();
  }
  
  // Dar formato capitalizado
  titulo = capitalizarTexto(titulo);
  if (autor) autor = capitalizarTexto(autor);
  
  // Completar campos por defecto
  document.getElementById("up-titulo").value = titulo;
  document.getElementById("up-autor").value = autor;
  
  // 2. Si es PDF, intentar leer metadatos binarios internos como mejora
  if (file.type === "application/pdf" || filename.toLowerCase().endsWith(".pdf")) {
    const blobSlice = file.slice(0, 45000); // Leer los primeros 45KB del archivo
    const reader = new FileReader();
    
    reader.onload = function(e) {
      const text = e.target.result;
      
      // Buscar etiquetas PDF /Title y /Author
      const titleMatch = text.match(/\/Title\s*\(([^)]+)\)/);
      const authorMatch = text.match(/\/Author\s*\(([^)]+)\)/);
      
      if (titleMatch && titleMatch[1]) {
        const decodedTitle = limpiarMetaPDF(titleMatch[1]);
        if (decodedTitle && decodedTitle.length > 2) {
          document.getElementById("up-titulo").value = decodedTitle;
        }
      }
      
      if (authorMatch && authorMatch[1]) {
        const decodedAuthor = limpiarMetaPDF(authorMatch[1]);
        if (decodedAuthor && decodedAuthor.length > 2) {
          document.getElementById("up-autor").value = decodedAuthor;
        }
      }
    };
    reader.readAsText(blobSlice, "ISO-8859-1");
  }
}

/**
 * Limpia y decodifica caracteres especiales de los metadatos de PDF
 */
function limpiarMetaPDF(str) {
  try {
    // Decodificar octales de escape si existen (ej: \341 para á)
    let cleaned = str.replace(/\\([0-7]{3})/g, (match, octal) => String.fromCharCode(parseInt(octal, 8)));
    // Quitar barras de escape generales
    cleaned = cleaned.replace(/\\(.)/g, "$1").trim();
    
    // Si la cadena parece encriptada o vacía
    if (cleaned.startsWith("feff") || cleaned.startsWith("þÿ")) {
      // Remover cabecera UTF-16 BE y decodificar
      return "";
    }
    return cleaned;
  } catch(e) {
    return str;
  }
}

/**
 * Capitaliza de forma elegante un texto en minúsculas/mayúsculas completas
 */
function capitalizarTexto(str) {
  if (!str) return "";
  if (str === str.toLowerCase() || str === str.toUpperCase()) {
    return str.split(' ')
              .filter(w => w.length > 0)
              .map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase())
              .join(' ');
  }
  return str;
}

                setTimeout(() => {
                  status.className = "status-box error";
                  status.textContent = response.message;
                }, 1500);
              }
            })
            .withFailureHandler(function(err) {
              clearInterval(progressInterval);
              consoleLines.push(`> [Servidor] FALLA DE RED: ${err.message}`);
              renderAntivirusConsole();
              setTimeout(() => {
                status.className = "status-box error";

/**
 * Simulación de máquina de escribir para consola
 */
function typeConsole(element, text) {
  let charIdx = 0;
  const originalHtml = element.innerHTML;
  
  function typeChar() {
    if (charIdx < text.length) {
      const char = text.charAt(charIdx);
      if (char === '\n') {
        element.innerHTML = originalHtml + text.substring(0, charIdx).replace(/\n/g, '<br>') + '<br>';
      } else {
        element.innerHTML = originalHtml + text.substring(0, charIdx).replace(/\n/g, '<br>') + char;
      }
      element.scrollTop = element.scrollHeight;
      charIdx++;
      setTimeout(typeChar, 8); // Velocidad de escritura rápida para no aburrir
    }
  }
  typeChar();
}

// ==========================================
// CONTROLADOR DE LECTOR 3D FLIPBOOK Y PANTALLA COMPLETA (v3.4.0)
// ==========================================
let currentReadingBookId = null;
let currentFlipbookPages = [];
let currentFlipPageIdx = 0;
let isFlipbookMode = false;
let isFullscreenActive = false;

function leerLibro(libroId, titulo, url) {
  if (!url) {
    alert("Este libro no tiene visor habilitado.");
    return;
  }
  
  // Registrar actividad
  registrarActividadUsuario(libroId, titulo, "Leer");
  
  currentReadingBookId = libroId;
  document.getElementById("reader-title").textContent = titulo;
  const frame = document.getElementById("reader-frame");
  frame.src = url;
  
  // Resetear estados
  isFlipbookMode = false;
  document.getElementById("reader-pdf-wrapper").style.display = "block";
  document.getElementById("reader-flipbook-wrapper").style.display = "none";
  document.getElementById("txt-reader-mode").textContent = "Modo Libro 3D";
  
  // Generar contenido de páginas simuladas para Modo Libro 3D
  prepararPaginasFlipbook(titulo);
  
  // Restaurar marcapáginas guardado previamente
  restaurarMarcapaginasGuardado(libroId);

  document.getElementById("reader-modal").classList.add("active");
}

function toggleReaderMode() {
  isFlipbookMode = !isFlipbookMode;
  const pdfWrap = document.getElementById("reader-pdf-wrapper");
  const flipWrap = document.getElementById("reader-flipbook-wrapper");
  const txtMode = document.getElementById("txt-reader-mode");

  if (isFlipbookMode) {
    pdfWrap.style.display = "none";
    flipWrap.style.display = "flex";
    txtMode.textContent = "Vista PDF Continuo";
    renderFlipbookPages();
  } else {
    pdfWrap.style.display = "block";
    flipWrap.style.display = "none";
    txtMode.textContent = "Modo Libro 3D";
  }
}

function toggleReaderFullscreen() {
  const modalElem = document.getElementById("reader-modal");
  const cardElem = document.getElementById("reader-modal-card");

  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    if (modalElem.requestFullscreen) {
      modalElem.requestFullscreen();
    } else if (modalElem.webkitRequestFullscreen) {
      modalElem.webkitRequestFullscreen();
    }
    cardElem.classList.add("fullscreen-mode");
    isFullscreenActive = true;
  } else {
    if (document.exitFullscreen) {
      document.exitFullscreen();
    } else if (document.webkitExitFullscreen) {
      document.webkitExitFullscreen();
    }
    cardElem.classList.remove("fullscreen-mode");
    isFullscreenActive = false;
  }
}

function prepararPaginasFlipbook(titulo) {
  currentFlipPageIdx = 0;
  currentFlipbookPages = [
    { num: 1, text: `<h3>${titulo}</h3><p style="margin-top:20px; font-style:italic; color:#718096;">Edición Iniciática de la Biblioteca Virtual GOSCh.</p><p style="margin-top:30px;">Compendio depositado en los archivos sagrados del Templo para la instrucción fraternal de los Masones libres y de buenas costumbres.</p>` },
    { num: 2, text: `<h4 style="color:#8c7851; font-family:serif;">PROEMIO Y PRINCIPIOS</h4><p>La búsqueda de la Verdad y la Luz exige del estudiante una constante disciplina de reflexión. Cada página de este volumen ha sido escuadrada para iluminar el entendimiento en el silencio del taller.</p><p style="margin-top:15px;">Conducíos con rectitud y guardad los preceptos tradicionales depositados en la bóveda de la razón.</p>` },
    { num: 3, text: `<h4 style="color:#8c7851; font-family:serif;">TRADICIÓN Y GEOMETRÍA</h4><p>La geometría es el lenguaje con el que el Gran Arquitecto del Universo trazó los contornos del cosmos. Al desvelar sus misterios, el iniciado descubre las proporciones armónicas de su propia alma.</p>` },
    { num: 4, text: `<h4 style="color:#8c7851; font-family:serif;">SIMBOLOGÍA APLICADA</h4><p>Los símbolos son recipientes vivos de la sabiduría ancestral. No se aprenden por memorización, sino por contemplación profunda en los momentos de trabajo masónico.</p>` },
    { num: 5, text: `<h4 style="color:#8c7851; font-family:serif;">EL ARTE REAL</h4><p>Transformar el plomo de las pasiones en el oro fino de las virtudes constituye el verdadero trabajo alquímico de nuestro Rito.</p>` },
    { num: 6, text: `<h4 style="color:#8c7851; font-family:serif;">CONCLUSIÓN Y LUZ</h4><p>Que las enseñanzas contenidas en este trazado os acompañen en todos vuestros pasos. Salus, Populi, Suprema Lex Esto.</p>` }
  ];
}

function renderFlipbookPages() {
  const leftPage = currentFlipbookPages[currentFlipPageIdx];
  const rightPage = currentFlipbookPages[currentFlipPageIdx + 1];

  const elLeftNum = document.getElementById("lbl-page-left-num");
  const elLeftTxt = document.getElementById("page-left-text");
  const elRightNum = document.getElementById("lbl-page-right-num");
  const elRightTxt = document.getElementById("page-right-text");
  const elIndicator = document.getElementById("flipbook-page-indicator");

  if (leftPage) {
    elLeftNum.textContent = `Página ${leftPage.num}`;
    elLeftTxt.innerHTML = leftPage.text;
  } else {
    elLeftNum.textContent = "";
    elLeftTxt.innerHTML = "";
  }

  if (rightPage) {
    elRightNum.textContent = `Página ${rightPage.num}`;
    elRightTxt.innerHTML = rightPage.text;
  } else {
    elRightNum.textContent = "";
    elRightTxt.innerHTML = "<p style='color:#a0aec0; text-align:center; margin-top:50px;'>Fin del Tomo</p>";
  }

  const totalPages = currentFlipbookPages.length;
  const currPageDisplay = leftPage ? leftPage.num : 1;
  elIndicator.textContent = `Páginas ${currPageDisplay} - ${rightPage ? rightPage.num : currPageDisplay} de ${totalPages}`;
}

function flipPageNext() {
  if (currentFlipPageIdx + 2 < currentFlipbookPages.length) {
    const book = document.getElementById("flipbook-book");
    book.classList.remove("page-turn-anim-next", "page-turn-anim-prev");
    void book.offsetWidth; // Trigger reflow
    book.classList.add("page-turn-anim-next");

    setTimeout(() => {
      currentFlipPageIdx += 2;
      renderFlipbookPages();
    }, 250);
  }
}

function flipPagePrev() {
  if (currentFlipPageIdx >= 2) {
    const book = document.getElementById("flipbook-book");
    book.classList.remove("page-turn-anim-next", "page-turn-anim-prev");
    void book.offsetWidth; // Trigger reflow
    book.classList.add("page-turn-anim-prev");

    setTimeout(() => {
      currentFlipPageIdx -= 2;
      renderFlipbookPages();
    }, 250);
  }
}

// Navegación por teclado (Flechas Izquierda / Derecha)
document.addEventListener("keydown", function(e) {
  const modal = document.getElementById("reader-modal");
  if (modal && modal.classList.contains("active") && isFlipbookMode) {
    if (e.key === "ArrowRight" || e.key === "PageDown") {
      flipPageNext();
    } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
      flipPagePrev();
    }
  }
});

// ==========================================
// SISTEMA DE MARCAPÁGINAS Y AVANCE DE LECTURA (v3.5.0)
// ==========================================
function obtenerClaveMarcapaginas(libroId) {
  const email = (currentUser && currentUser.email) ? currentUser.email.toLowerCase() : "invitado";
  return `gosch_bookmark_${email}_${libroId}`;
}

function guardarMarcapaginas(libroId, paginaNum) {
  if (!libroId) return;
  const key = obtenerClaveMarcapaginas(libroId);
  const data = {
    page: paginaNum,
    total: currentFlipbookPages.length || 12,
    timestamp: Date.now()
  };
  SafeStorage.setItem(key, JSON.stringify(data));
}

function obtenerMarcapaginasGuardado(libroId) {
  if (!libroId) return null;
  const key = obtenerClaveMarcapaginas(libroId);
  const raw = SafeStorage.getItem(key);
  if (!raw) return null;
  try {
    return JSON.parse(raw);
  } catch(e) {
    return null;
  }
}

function restaurarMarcapaginasGuardado(libroId) {
  const bookmark = obtenerMarcapaginasGuardado(libroId);
  if (bookmark && bookmark.page) {
    // Si la página guardada es válida, ajustamos el índice
    const targetIdx = Math.max(0, Math.min(bookmark.page - 1, currentFlipbookPages.length - 1));
    // Asegurar índice par para vista doble página
    currentFlipPageIdx = targetIdx % 2 === 0 ? targetIdx : targetIdx - 1;
    if (currentFlipPageIdx < 0) currentFlipPageIdx = 0;
  }
}

function marcarAvanceManual() {
  if (!currentReadingBookId) return;
  const currPage = currentFlipPageIdx + 1;
  guardarMarcapaginas(currentReadingBookId, currPage);
  
  // Mostrar mensaje fraternal de confirmación
  const titleElem = document.getElementById("reader-title");
  const oldTitle = titleElem.textContent;
  titleElem.textContent = `🔖 Avance Guardado: Página ${currPage} de ${currentFlipbookPages.length}`;
  titleElem.style.color = "var(--gold-primary)";
  
  setTimeout(() => {
    titleElem.textContent = oldTitle;
    titleElem.style.color = "";
  }, 2500);
}

// Auto-guardar avance al pasar de página
const oldFlipNext = flipPageNext;
flipPageNext = function() {
  if (currentFlipPageIdx + 2 < currentFlipbookPages.length) {
    const book = document.getElementById("flipbook-book");
    book.classList.remove("page-turn-anim-next", "page-turn-anim-prev");
    void book.offsetWidth;
    book.classList.add("page-turn-anim-next");

    setTimeout(() => {
      currentFlipPageIdx += 2;
      renderFlipbookPages();
      guardarMarcapaginas(currentReadingBookId, currentFlipPageIdx + 1);
    }, 250);
  }
};

const oldFlipPrev = flipPagePrev;
flipPagePrev = function() {
  if (currentFlipPageIdx >= 2) {
    const book = document.getElementById("flipbook-book");
    book.classList.remove("page-turn-anim-next", "page-turn-anim-prev");
    void book.offsetWidth;
    book.classList.add("page-turn-anim-prev");

    setTimeout(() => {
      currentFlipPageIdx -= 2;
      renderFlipbookPages();
      guardarMarcapaginas(currentReadingBookId, currentFlipPageIdx + 1);
    }, 250);
  }
};
